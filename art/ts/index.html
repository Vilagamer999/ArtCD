<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrie Smith</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }
        .window {
            background-color: #FAFAFA;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .title-bar {
            background-color: #f6f6f6;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
        }
        .title {
            font-weight: 500;
            font-size: 14px;
            color: #333;
        }
        .window-controls {
            display: flex;
        }
        .control-button {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 8px;
            cursor: pointer;
        }
        .close { background-color: #ff5f56; }
        .minimize { background-color: #ffbd2e; }
        .expand { background-color: #27c93f; }
        .content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 20px;
        }
        .item {
            background-color: transparent;
            border-radius: 5px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 140px;
        }
        .item:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }
        .folder {
            color: #4a86e8;
        }
        .folder-icon, .file-icon {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        .item-name {
            font-size: 12px;
            word-break: break-word;
            color: #333;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        .modal-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 90%;
            max-height: 90%;
        }
        .modal-content {
            max-width: 100%;
            max-height: calc(90vh - 40px);
            object-fit: contain;
            cursor: pointer;
        }
        .modal-info {
            color: #fff;
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
        }
        .close-modal {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
        }
        .close-modal:hover,
        .close-modal:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background-color: rgba(0,0,0,0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .nav-arrow:hover {
            background-color: rgba(0,0,0,0.7);
        }
        .prev-arrow { left: 20px; }
        .next-arrow { right: 20px; }
        .nav-arrow::before {
            content: '';
            width: 20px;
            height: 20px;
            border-top: 3px solid white;
            border-right: 3px solid white;
            display: inline-block;
        }
        .prev-arrow::before {
            transform: rotate(-135deg);
        }
        .next-arrow::before {
            transform: rotate(45deg);
        }
    </style>
</head>

    const folderIconUrl = "folder.webp";
    const fileIconUrl = "file.webp";

    let currentPath = [];
    let isFullscreen = false;
    let currentImageIndex = 0;
    let imageList = [];
    let rootScrollPosition = 0;

    // Lazy loading
    const lazyLoadObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const img = entry.target;
                img.src = img.dataset.src;
                observer.unobserve(img);
            }
        });
    }, { rootMargin: "200px" });

    // Preload images
    function preloadImages(urls) {
        urls.forEach(url => {
            const img = new Image();
            img.src = url;
        });
    }

    // Throttle function
    function throttle(func, limit) {
        let inThrottle;
        return function() {
            const args = arguments;
            const context = this;
            if (!inThrottle) {
                func.apply(context, args);
                inThrottle = true;
                setTimeout(() => inThrottle = false, limit);
            }
        }
    }

    function renderFileViewer() {
        const fileViewer = document.getElementById('file-viewer');
        fileViewer.innerHTML = '';

        if (currentPath.length > 0) {
            const backItem = document.createElement('div');
            backItem.className = 'item folder';
            backItem.innerHTML = `
                <img src="${folderIconUrl}" alt="Back" class="folder-icon">
                <span class="item-name">..</span>
            `;
            backItem.onclick = () => {
                currentPath.pop();
                renderFileViewer();
                if (currentPath.length === 0) {
                    setTimeout(() => {
                        document.querySelector('.content').scrollTop = rootScrollPosition;
                    }, 0);
                }
            };
            fileViewer.appendChild(backItem);
        }

        let currentFolder = fileStructure;
        for (const folder of currentPath) {
            currentFolder = currentFolder[folder];
        }

        imageList = [];
        const imagesToPreload = [];

        for (const [name, content] of Object.entries(currentFolder)) {
            const item = document.createElement('div');
            item.className = 'item';

            if (typeof content === 'object') {
                item.className += ' folder';
                item.innerHTML = `
                    <img src="${folderIconUrl}" alt="Folder" class="folder-icon">
                    <span class="item-name">${name}</span>
                `;
                item.onclick = () => {
                    if (currentPath.length === 0) {
                        rootScrollPosition = document.querySelector('.content').scrollTop;
                    }
                    currentPath.push(name);
                    renderFileViewer();
                };
            } else {
                const isImage = content.toLowerCase().match(/\.(jpeg|jpg|gif|png|webp)$/);
                const imgSrc = isImage ? content : fileIconUrl;
                item.innerHTML = `
                    <img data-src="${imgSrc}" alt="${name}" class="${isImage ? 'folder-icon' : 'file-icon'}" loading="lazy">
                    <span class="item-name">${name}</span>
                `;
                if (isImage) {
                    imageList.push(content);
                    imagesToPreload.push(content);
                    item.onclick = () => openModal(content, name);
                } else {
                    item.onclick = () => window.open(content, '_blank');
                }
                lazyLoadObserver.observe(item.querySelector('img'));
            }

            fileViewer.appendChild(item);
        }

        updateTitle();
        preloadImages(imagesToPreload.slice(0, 5)); // Preload first 5 images
    }

    const updateTitle = throttle(() => {
        const title = document.querySelector('.title');
        title.textContent = 'Terrie Smith - ' + (currentPath.length > 0 ? currentPath.join(' - ') : 'Home');
    }, 100);

    function openModal(src, name) {
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');
        const modalInfo = document.getElementById('modal-info');
        
        modal.style.display = "flex";
        modalImg.src = src;
        modalImg.alt = name;
        
        currentImageIndex = imageList.indexOf(src);
        
        modalImg.onload = function() {
            const width = this.naturalWidth;
            const height = this.naturalHeight;
            modalInfo.innerHTML = `Resolution: ${width} x ${height}<br>Click image to open in new tab`;
            updateArrows();
        };

        modalImg.onerror = function() {
            this.onerror = null;
            this.src = fileIconUrl;
            modalInfo.innerHTML = `Unable to load image: ${name}<br>Click to open in new tab`;
            updateArrows();
        };

        modalImg.onclick = function() {
            window.open(src, '_blank');
        };

        // Preload next and previous images
        if (currentImageIndex > 0) preloadImages([imageList[currentImageIndex - 1]]);
        if (currentImageIndex < imageList.length - 1) preloadImages([imageList[currentImageIndex + 1]]);
    }

    const updateArrows = throttle(() => {
        const prevArrow = document.querySelector('.prev-arrow');
        const nextArrow = document.querySelector('.next-arrow');
        
        prevArrow.style.display = currentImageIndex > 0 ? 'flex' : 'none';
        nextArrow.style.display = currentImageIndex < imageList.length - 1 ? 'flex' : 'none';
    }, 100);

    function navigateImage(direction) {
        currentImageIndex += direction;
        if (currentImageIndex >= 0 && currentImageIndex < imageList.length) {
            const newSrc = imageList[currentImageIndex];
            openModal(newSrc, newSrc.split('/').pop());
        }
    }

    const modal = document.getElementById('modal');
    const span = document.getElementsByClassName("close-modal")[0];

    span.onclick = function() {
        modal.style.display = "none";
    }

    window.onclick = function(event) {
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }

    document.querySelector('.prev-arrow').addEventListener('click', () => navigateImage(-1));
    document.querySelector('.next-arrow').addEventListener('click', () => navigateImage(1));

    // Window control buttons functionality
    document.querySelector('.close').addEventListener('click', () => {
        window.close();
    });

    document.querySelector('.minimize').addEventListener('click', () => {
        if (isFullscreen) {
            document.exitFullscreen().catch(err => {
                console.error(`Error attempting to exit full-screen mode: ${err.message} (${err.name})`);
            });
        }
    });

    document.querySelector('.expand').addEventListener('click', () => {
        if (!isFullscreen) {
            document.querySelector('.window').requestFullscreen().then(() => {
                isFullscreen = true;
            }).catch(err => {
                console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
            });
        } else {
            document.exitFullscreen().then(() => {
                isFullscreen = false;
            }).catch(err => {
                console.error(`Error attempting to exit full-screen mode: ${err.message} (${err.name})`);
            });
        }
    });

    document.addEventListener('fullscreenchange', () => {
        isFullscreen = !!document.fullscreenElement;
    });

    renderFileViewer();
</script>
