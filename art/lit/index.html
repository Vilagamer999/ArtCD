<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Reader</title>
    <style>
        :root[data-theme="light"] {
            --bg-primary: #f4f4f0;
            --bg-secondary: #e4e4e0;
            --text-primary: #222;
            --text-secondary: #444;
            --border: #666;
        }

        :root[data-theme="dark"] {
            --bg-primary: #222;
            --bg-secondary: #333;
            --text-primary: #e4e4e0;
            --text-secondary: #c4c4c0;
            --border: #888;
        }

        body {
            font-family: Georgia, serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            margin-bottom: 1rem;
            width: 100%;
            box-sizing: border-box;
        }

        header {
            border-bottom: 1px solid var(--border);
            background: var(--bg-primary);
            z-index: 50;
        }

        button {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--bg-primary);
            border-color: var(--text-primary);
        }

        .book-actions {
            display: flex;
            gap: 0.5rem;
        }

        .booklist {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .book {
            display: flex;
            gap: 1.5rem;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            align-items: center;
        }

        .book:hover {
            background: var(--bg-secondary);
        }

        .cover {
            width: 105px;
            height: 155px;
            object-fit: cover;
            background: var(--bg-secondary);
            flex-shrink: 0;
        }

        .center {
            display: block;
            margin-left: auto;
            margin-right: auto;
            width: 50%;
        }

        .info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .info h2 {
            margin: 0;
        }

        .meta {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin: 0;
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .search-controls {
            display: flex;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
        }

        .search-input,
        .sort-select {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .search-input {
            flex: 1;
        }

        .sort-select {
            width: 8rem;
        }

        .search-input:hover,
        .sort-select:hover {
            border-color: var(--text-primary);
        }

        #reader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            z-index: 100;
            display: none;
            flex-direction: column;
        }

        #reader.active {
            display: flex;
        }

        .reader-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .left-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .font-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .nav-hint {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.3s;
            pointer-events: all;
            white-space: nowrap;
            z-index: 1;
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            .nav-hint {
                display: none;
            }

            .reader-header {
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .left-controls {
                flex: 1;
                justify-content: space-between;
            }

            button {
                min-height: 44px;
                min-width: 44px;
                padding: 0.75rem 1rem;
            }

            #progress-bar {
                height: 6px;
            }

            #progress-bar::-webkit-slider-thumb {
                width: 18px;
                height: 18px;
            }

            #progress-bar::-moz-range-thumb {
                width: 18px;
                height: 18px;
            }

            .reader-footer {
                padding: 1rem 0.5rem;
                gap: 0.5rem;
            }

            .search-controls {
                flex-direction: column;
                gap: 0.5rem;
            }

            .search-input,
            .sort-select {
                min-height: 44px;
                width: 100%;
            }

            .book {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .cover {
                width: 100%;
                height: auto;
                max-width: 200px;
                align-self: center;
            }
        }

        #theme-toggle {
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reader-main {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .reader-footer {
            background: var(--bg-primary);
            padding: 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 10;
        }

        #progress-bar {
            flex: 1;
            margin: 0 1rem;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--bg-secondary);
            border-radius: 0;
            cursor: pointer;
        }

        #progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: var(--text-primary);
            border: none;
        }

        #progress-bar::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: var(--text-primary);
            border: none;
        }

        .page-counter {
            color: var(--text-secondary);
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .loading-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .loading-bar {
            width: 200px;
            height: 4px;
            background: var(--bg-secondary);
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-progress {
            width: 100%;
            height: 100%;
            background: var(--text-primary);
            transform: translateX(-100%);
            animation: loading 1s infinite;
        }

        foliate-view {
            width: 100%;
            height: 100%;
        }

        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>
    <div id="library-view">
        <header>
            <div class="container">
                <img src="cover.webp" alt="cover" class="center">
            </div>
        </header>

        <main class="container">
            <div class="search-controls">
                <input type="search" class="search-input" placeholder="Search books...">
                <select class="sort-select">
                    <option value="title-asc">Title A-Z</option>
                    <option value="title-desc">Title Z-A</option>
                    <option value="author-asc">Author A-Z</option>
                    <option value="author-desc">Author Z-A</option>
                    <option value="year-desc">Newest First</option>
                    <option value="year-asc">Oldest First</option>
                </select>
            </div>
            <ul class="booklist"></ul>
        </main>
    </div>

    <div id="reader">
        <div class="reader-header">
            <div class="left-controls">
                <button id="back-btn">Back to Library</button>
                <div class="font-controls">
                    <button id="decrease-font">A-</button>
                    <button id="increase-font">A+</button>
                </div>
            </div>
            <span class="nav-hint">CLICK ME!</span>
            <button id="theme-toggle">
                <span class="theme-icon">☀️</span>
            </button>
        </div>
        <div class="reader-main"></div>
        <div class="reader-footer">
            <button id="prev-page">Previous</button>
            <input type="range" id="progress-bar" min="0" max="1" step="0.001">
            <span class="page-counter">0/0</span>
            <button id="next-page">Next</button>
        </div>
    </div>

    <div class="loading-overlay">
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
    </div>

    <script src="./books/books.js" type="module"></script>
    <script type="module">
        import './foliate-js/view.js'
        import books from './books/books.js';

        const hints = [
            "Use arrow keys to navigate pages!",
            "Press A+ A- to adjust text size",
            "Use progress bar to instantly jump to any page",
            "Toggle theme for a more comfortable reading experiance (light mode is more comfy tho >:3)",
            "Made with <3 for furz by furz :3",
            "Brought to you by Foliate.js, [energy beverage] and a lack of sleep",
            "More books and features will be added soon™",
        ];

        let view = null;
        let fontSize = 1.2;
        const MIN_FONT_SIZE = 0.8;
        const MAX_FONT_SIZE = 2;
        const FONT_STEP = 0.1;
        const $ = document.querySelector.bind(document);

        function showRandomHint() {
            const hintElement = $('.nav-hint');
            const currentHint = hintElement.textContent;
            let newHint;
            do {
                newHint = hints[Math.floor(Math.random() * hints.length)];
            } while (newHint === currentHint);
            
            hintElement.style.opacity = '0';
            setTimeout(() => {
                hintElement.textContent = newHint;
                hintElement.style.opacity = '1';
            }, 300);
        }

        function flattenBooks(books) {
            return books.flatMap(authorGroup => 
                authorGroup.series.flatMap(series => 
                    series.books.map(book => ({
                        ...book,
                        author: authorGroup.author,
                        series: series.name
                    }))
                )
            );
        }

        function sortBooks(books, method) {
            const flatBooks = flattenBooks(books);
            const sorters = {
                'title-asc': (a, b) => a.title.localeCompare(b.title),
                'title-desc': (a, b) => b.title.localeCompare(a.title),
                'author-asc': (a, b) => a.author.localeCompare(b.author),
                'author-desc': (a, b) => b.author.localeCompare(a.author),
                'year-asc': (a, b) => (a.year || 0) - (b.year || 0),
                'year-desc': (a, b) => (b.year || 0) - (a.year || 0),
            };
            return flatBooks.sort(sorters[method]);
        }

        function filterBooks(query) {
            const flatBooks = flattenBooks(books);
            query = query.toLowerCase();
            return flatBooks.filter(book => 
                book.title.toLowerCase().includes(query) ||
                book.author.toLowerCase().includes(query) ||
                (book.genre || '').toLowerCase().includes(query) ||  // Handle potentially undefined genre
                (book.series || '').toLowerCase().includes(query)    // Add series search
            );
        }

        function updateLibrary() {
            const query = $('.search-input').value.trim();
            const sortMethod = $('.sort-select').value;
            const filteredBooks = query ? filterBooks(query) : books;
            const sortedBooks = sortBooks(filteredBooks, sortMethod);
            
            $('.booklist').innerHTML = sortedBooks.map(book => `
                <li class="book">
                    <img class="cover" 
                         src="${book.cover}" 
                         alt="Cover of ${book.title}"
                         onerror="this.src='./covers/generic.webp'">
                    <div class="book-info">
                        <h2>${book.title}</h2>
                        <p class="book-meta">
                            ${book.author} (${book.year})<br>
                            ${book.genre} · ${book.format.toUpperCase()} · ${book.pages || '?'} pages
                            ${book.series ? `<br>Series: ${book.series}` : ''}
                        </p>
                        <div class="book-actions">
                            <button type="button" data-book-path="./books/${book.path}">Read</button>
                            <a href="./books/${book.path}" download>
                                <button type="button">Download</button>
                            </a>
                        </div>
                    </div>
                </li>
            `).join('');
        }

        function updateFontSize() {
            if (view) {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                view.renderer.setStyles?.(`
                    :root {
                        font-size: ${fontSize}rem;
                        color: ${!isDark ? '#222' : '#e4e4e0'} !important;
                        background-color: ${!isDark ? '#f4f4f0' : '#222'} !important;
                    }
                `);
            }
        }

        async function openBook(path) {
            $('.loading-overlay').classList.add('active');
            try {
                if (view) {
                    view.close();
                    view.remove();
                }

                view = document.createElement('foliate-view');
                $('.reader-main').appendChild(view);

                view.addEventListener('relocate', e => {
                    const { fraction, total } = e.detail;
                    $('#progress-bar').value = fraction;
                    const currentPage = Math.min(Math.ceil(fraction * total), total);
                    if (total > 0) {
                        $('.page-counter').textContent = `${currentPage}/${total}`;
                    } else {
                        $('.page-counter').textContent = '0/0';
                    }
                });

                await view.open(path);
                await view.init({ showTextStart: true });
                
                $('#reader').classList.add('active');
                $('#library-view').style.display = 'none';
                updateFontSize();
            } catch (error) {
                console.error('Error loading book:', error);
                alert('Error loading book. Please try again.');
            } finally {
                $('.loading-overlay').classList.remove('active');
            }
        }

        // Event Listeners
        $('.booklist').addEventListener('click', e => {
            const button = e.target.closest('[data-book-path]');
            if (button) {
                openBook(button.dataset.bookPath);
            }
        });

        $('#back-btn').addEventListener('click', () => {
            $('#reader').classList.remove('active');
            $('#library-view').style.display = 'block';
        });

        $('#decrease-font').addEventListener('click', () => {
            if (fontSize > MIN_FONT_SIZE) {
                fontSize -= FONT_STEP;
                updateFontSize();
            }
        });

        $('#increase-font').addEventListener('click', () => {
            if (fontSize < MAX_FONT_SIZE) {
                fontSize += FONT_STEP;
                updateFontSize();
            }
        });

        $('#theme-toggle').addEventListener('click', () => {
            const root = document.documentElement;
            const isDark = root.getAttribute('data-theme') === 'dark';
            root.setAttribute('data-theme', isDark ? 'light' : 'dark');
            $('#theme-toggle').querySelector('.theme-icon').textContent = isDark ? '☀️' : '🌙';
            updateFontSize();
        });

        document.addEventListener('keydown', e => {
            if (!view) return;
            if (e.key === 'ArrowLeft') view.goLeft();
            else if (e.key === 'ArrowRight') view.goRight();
        });

        $('#prev-page').addEventListener('click', () => view?.goLeft());
        $('#next-page').addEventListener('click', () => view?.goRight());
        $('#progress-bar').addEventListener('input', e => view?.goToFraction(parseFloat(e.target.value)));

        // Search and sort event listeners
        $('.search-input').addEventListener('input', updateLibrary);
        $('.sort-select').addEventListener('change', updateLibrary);
        $('.nav-hint').addEventListener('click', showRandomHint);

        // Initialize
        updateLibrary();
    </script>
</body>
</html>
