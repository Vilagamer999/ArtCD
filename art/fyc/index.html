        .title-bar {

            font-weight: bold;
            margin-left: 4px;

        }

        .title-bar-controls {
            display: flex;
            gap: 2px;
            margin-left: auto;
            height: 14px;
        }

        .control-button {
            width: 16px;
            height: 14px;
            background: #c0c0c0;
            border: 1px outset #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-family: "Courier New", monospace;
            font-size: 10px;
            padding: 0;
            line-height: 14px;
            position: relative;
            font-weight: bold;
        }

        .control-button.minimize::after {
            content: "_";
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
        }

        .control-button.maximize::after {
            content: "▢";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            font-size: 12px;
        }

        .control-button.close::after {
            content: "X";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .address-bar {
            background: #c0c0c0;
            padding: 3px;
            margin-top: 4px;
            margin-bottom: -2px;
            display: flex;
            align-items: center;
            font-size: 11px;
            height: 20px;
        }

        .address-box {
            flex: 1;
            background: white;
            border: 1px inset #808080;
            padding: 2px 4px;
            margin-right: 2px;
            margin-left: 2px;
            font-family: "MS Sans Serif", Arial, sans-serif;
            height: 14px;
            display: flex;
            align-items: center;
        }

        .address-text {
            flex: 1;
            letter-spacing: 0.2px;
        }

        .window-content {
            height: calc(100% - 95px);
            overflow: auto;
            background: white;
            border: 1px inset #808080;
            margin: 5px;
        }

        .folder {
            display: inline-block;
            margin: 12px;
            text-align: center;
            cursor: pointer;
            width: 100px;
        }

        .folder img {
            width: 64px;
            height: 64px;
            margin-bottom: 6px;
        }

        .folder div {
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            font-size: 12px;
            padding: 0 2px;
            width: 100%;
            line-height: 1.2;
        }

        .taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: #c0c0c0;
            border-top: 2px solid #ffffff;
            display: flex;
            padding: 2px;
            gap: 2px;
            padding-left: 2px;
            z-index: 10000;
        }

        .taskbar-items {
            display: flex;
            flex-direction: row;
            gap: 2px;
            height: 100%;
            flex: 1;
        }

        .taskbar-item {
            padding: 2px 8px;
            background: #c0c0c0;
            border: 2px outset #ffffff;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        .taskbar-item.minimized {
            border: 2px inset #808080;
            background: #d4d0c8;
            padding: 3px 8px 1px 8px;
        }

        .taskbar-item.active {
            border: 1px inset #808080;
            background: #d4d0c8;
        }

        .image-window {
            position: absolute;
            background: #c0c0c0;
            border: 2px outset #ffffff;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        .image-content {
            padding: 2px;
            background: white;
            border: 1px inset #808080;
        }

        .window.fullscreen {
            width: 100vw !important;
            height: calc(100vh - 32px) !important;
            top: 0 !important;
            left: 0 !important;
        }

        /* Menu bar styles */
        .menu-bar {
            background: #c0c0c0;
            border-bottom: 1px solid #808080;
            padding: 2px;
            font-size: 11px;
            height: 20px;
            display: flex;
            align-items: center;
        }

        .menu-item {
            padding: 2px 8px;
            cursor: pointer;
        }

        .menu-item:hover {
            background: #0a246a;
            color: white;
        }

        .resizer {
            width: 20px;
            height: 20px;
            position: absolute;
            right: 0;
            bottom: 0;

        .status-bar {
            height: 20px;
            background: #c0c0c0;
            border-top: 1px solid #808080;
            border-bottom: none;
            display: flex;
            justify-content: space-between;

            padding: 0 5px;

            position: absolute;
            bottom: 2px;
            left: 5px;

            background: #c0c0c0;

            margin-right: 2px;

            align-items: center;
            justify-content: center;
            cursor: pointer;

      let activeWindows = new Set();
      let zIndex = 1000;
      let isFullscreen = false;
      let currentPath = [];
      let previousState = {
          width: '500px',
          height: '400px',
          top: '50px',
          left: '50px'
      };

      function makeDraggable(element) {
          let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
          element.querySelector('.title-bar').onmousedown = dragMouseDown;

          function dragMouseDown(e) {
              if (isFullscreen || e.target.classList.contains('control-button')) return;
              e.preventDefault();
              pos3 = e.clientX;
              pos4 = e.clientY;
              document.onmouseup = closeDragElement;
              document.onmousemove = elementDrag;
              element.style.zIndex = ++zIndex;
          }

          function elementDrag(e) {
              if (isFullscreen) return;
              e.preventDefault();
              pos1 = pos3 - e.clientX;
              pos2 = pos4 - e.clientY;
              pos3 = e.clientX;
              pos4 = e.clientY;
              element.style.top = (element.offsetTop - pos2) + "px";
              element.style.left = (element.offsetLeft - pos1) + "px";
          }

          function closeDragElement() {
              document.onmouseup = null;
              document.onmousemove = null;
          }
      }

      const mainWindow = document.getElementById('mainWindow');
      makeDraggable(mainWindow);

      const resizer = document.createElement('div');
      resizer.className = 'resizer';
      mainWindow.appendChild(resizer);

      let isResizing = false;
      resizer.addEventListener('mousedown', (e) => {
          if (isFullscreen) return;
          isResizing = true;
          document.addEventListener('mousemove', resize);
          document.addEventListener('mouseup', stopResize);
      });

      function resize(e) {
          if (!isResizing || isFullscreen) return;
          mainWindow.style.width = (e.clientX - mainWindow.offsetLeft) + 'px';
          mainWindow.style.height = (e.clientY - mainWindow.offsetTop) + 'px';
      }

      function stopResize() {
          isResizing = false;
          document.removeEventListener('mousemove', resize);
          document.removeEventListener('mouseup', stopResize);
      }

      mainWindow.querySelector('.minimize').onclick = () => {
          mainWindow.style.display = 'none';
          updateTaskbar();
      };

      mainWindow.querySelector('.maximize').onclick = () => {
          if (!isFullscreen) {
              previousState = {
                  width: mainWindow.style.width,
                  height: mainWindow.style.height,
                  top: mainWindow.style.top,
                  left: mainWindow.style.left
              };
              mainWindow.classList.add('fullscreen');
              isFullscreen = true;
          } else {
              mainWindow.classList.remove('fullscreen');
              mainWindow.style.width = previousState.width;
              mainWindow.style.height = previousState.height;
              mainWindow.style.top = previousState.top;
              mainWindow.style.left = previousState.left;
              isFullscreen = false;
          }
      };

      mainWindow.querySelector('.close').onclick = () => {
          mainWindow.style.display = 'none';
          updateTaskbar();
      };

      function updateTaskbar() {
          const taskbarItems = document.getElementById('taskbar-items');
          const mainWindow = document.getElementById('mainWindow');
          taskbarItems.innerHTML = '';
          
          const mainItem = createTaskbarItem('Fursuit Yiff Collection', mainWindow);
          
          if (mainWindow.style.display === 'none') {
              mainItem.classList.add('minimized');
          }
          taskbarItems.appendChild(mainItem);

          activeWindows.forEach(id => {
              const imgWindow = document.getElementById(`window-${id}`);
              if (imgWindow) {
                  const item = createTaskbarItem(imgWindow.dataset.title, imgWindow);
                  if (imgWindow.style.display === 'none') {
                      item.classList.add('minimized');
                  }
                  taskbarItems.appendChild(item);
              }
          });
      }

      function createTaskbarItem(text, window) {
          const item = document.createElement('div');
          item.className = 'taskbar-item';
          item.textContent = text;
          item.onclick = () => {
              if (window.style.display === 'none') {
                  window.style.display = 'block';
                  window.style.zIndex = ++zIndex;
              } else {
                  window.style.display = 'none';
              }
              updateTaskbar();
          };
          return item;
      }

      function updateAddressBar() {
          const addressText = document.querySelector('.address-text');
          if (currentPath.length > 0) {
              addressText.textContent = `F:\\My Pictures\\${currentPath.join('\\')}`;
          } else {
              addressText.textContent = 'F:\\My Pictures';
          }
      }

      function openFolder(folderName) {
          currentPath.push(folderName);
          const content = mainWindow.querySelector('.window-content');
          let currentFolder = folders;
          
          try {
              for (let pathPart of currentPath) {
                  if (!currentFolder[pathPart] || !currentFolder[pathPart].content) {
                      throw new Error('Invalid folder path');
                  }
                  currentFolder = currentFolder[pathPart].content;
              }
          } catch (error) {
              console.error('Error accessing folder:', error);
              currentPath.pop();
              return;
          }
          
          let folderContent = '';
          if (currentFolder && currentFolder.files && Array.isArray(currentFolder.files)) {
            folderContent = currentFolder.files.map(img => `
                <div class="folder" onclick="openImage('${img.id}', '${img.url}', '${img.title}')">
                    <img src="${img.url}" style="width: 64px; height: 64px; object-fit: cover;">
                    <div title="${img.title}">${img.title}</div>
                </div>
            `).join('');
          }

          let foldersHtml = '';
          if (currentFolder) {
              foldersHtml = Object.entries(currentFolder)
                  .filter(([name]) => name !== 'files')
                  .map(([name, data]) => `
                      <div class="folder" onclick="openFolder('${name}')">
                          <img src="folder.png" alt="folder">
                          <div title="${name}">${name}</div>
                      </div>
                  `).join('');
          }

          content.innerHTML = `
              <div class="folder" onclick="goBack()">
                  <img src="folder.png" alt="back">
                  <div>..</div>
              </div>
              ${foldersHtml}
              ${folderContent}
          `;

          updateAddressBar();
          let itemCount = 
              ((currentFolder && currentFolder.files) ? currentFolder.files.length : 0) +
              (currentFolder ? Object.entries(currentFolder).filter(([name]) => name !== 'files').length : 0);
          updateStatusBar(itemCount);
      }

      function goBack() {

          currentPath.pop();
          const content = mainWindow.querySelector('.window-content');
          
          if (currentPath.length > 0) {
              // Navigate to the current folder level
              let currentFolder = folders;
              for (let pathPart of currentPath) {
                  currentFolder = currentFolder[pathPart].content;
              }
              
              let folderContent = '';
              if (currentFolder.files) {
                folderContent = currentFolder.files.map(img => `
                    <div class="folder" onclick="openImage('${img.id}', '${img.url}', '${img.title}')">
                        <img src="${img.url}" style="width: 64px; height: 64px; object-fit: cover;">
                        <div title="${img.title}">${img.title}</div>
                    </div>
                `).join('');
              }

              let foldersHtml = Object.entries(currentFolder)
                  .filter(([name]) => name !== 'files')
                  .map(([name, data]) => `
                      <div class="folder" onclick="openFolder('${name}')">
                          <img src="folder.png" alt="folder">
                          <div title="${name}">${name}</div>
                      </div>
                  `).join('');

              content.innerHTML = `
                  <div class="folder" onclick="goBack()">
                      <img src="folder.png" alt="back">
                      <div>..</div>
                  </div>
                  ${foldersHtml}
                  ${folderContent}
              `;

              updateAddressBar();
              let itemCount = (currentFolder.files?.length || 0) +
                  Object.entries(currentFolder).filter(([name]) => name !== 'files').length;
              updateStatusBar(itemCount);
              return;
          }

          let rootContent = '';
          if (folders.files) {
              rootContent = folders.files.map(img => `
                  <div class="folder" onclick="openImage('${img.id}', '${img.url}', '${img.title}')">
                      <img src="${img.url}" style="width: 48px; height: 48px; object-fit: cover;">
                      <div>${img.title}</div>
                  </div>
              `).join('');
          }

          let foldersHtml = Object.entries(folders)
              .filter(([name]) => name !== 'files')
              .map(([name, data]) => `
                  <div class="folder" onclick="openFolder('${name}')">
                      <img src="folder.png" alt="folder">
                      <div>${name}</div>
                  </div>
              `).join('');

          content.innerHTML = `
              ${foldersHtml}
              ${rootContent}
          `;

          updateAddressBar();
          let itemCount = (folders.files?.length || 0) +
              Object.entries(folders).filter(([name]) => name !== 'files').length;
          updateStatusBar(itemCount);
      }

      function openImage(id, url, title) {
          if (activeWindows.has(id)) {
              const existing = document.getElementById(`window-${id}`);
              if (existing.style.display === 'none') {
                  existing.style.display = 'block';
                  existing.style.zIndex = ++zIndex;
              } else {
                  existing.style.display = 'none';
              }
              updateTaskbar();
              return;
          }

          const img = new Image();
          img.src = url;
          img.onload = () => {

              const viewportWidth = window.innerWidth;
              const viewportHeight = window.innerHeight;
              

              const maxWidth = viewportWidth * 0.95;
              const maxHeight = viewportHeight * 0.95;
              
              let finalWidth = img.width;
              let finalHeight = img.height;
              
              if (finalWidth > maxWidth || finalHeight > maxHeight) {
                  const ratio = Math.min(maxWidth / finalWidth, maxHeight / finalHeight);
                  finalWidth = Math.floor(finalWidth * ratio);
                  finalHeight = Math.floor(finalHeight * ratio);
              }

              const imageWindow = document.createElement('div');  // Changed from 'window' to 'imageWindow'
              imageWindow.id = `window-${id}`;
              imageWindow.dataset.title = title;
              imageWindow.className = 'image-window';
              imageWindow.style.width = (finalWidth + 4) + 'px';
              imageWindow.style.top = '70px';
              imageWindow.style.left = '70px';
              
              imageWindow.innerHTML = `
                  <div class="title-bar">
                      <span class="title-bar-text">${title}</span>
                      <div class="title-bar-controls">
                          <button class="control-button minimize"></button>
                          <button class="control-button close"></button>
                      </div>
                  </div>
                  <div class="image-content">
                      <img 
                          src="${url}" 
                          alt="${title}" 
                          style="width: ${finalWidth}px; height: ${finalHeight}px; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges;"
                      >
                  </div>
              `;

              document.body.appendChild(imageWindow);
              makeDraggable(imageWindow);
              activeWindows.add(id);

              imageWindow.querySelector('.minimize').onclick = () => {
                  imageWindow.style.display = 'none';
                  updateTaskbar();
              };

              imageWindow.querySelector('.close').onclick = () => {
                  imageWindow.remove();
                  activeWindows.delete(id);
                  updateTaskbar();
              };

              imageWindow.style.zIndex = ++zIndex;
              updateTaskbar();
          };
      }

      function updateStatusBar(itemCount) {
          const statusItems = document.querySelector('.status-items');
          statusItems.textContent = `${itemCount} item(s)`;
      }

      goBack();
      updateTaskbar();
    </script>
