<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fursuit Yiff Collection</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #008081;
            background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFElEQVQIW2M8fPjwfwYGBgZGGAMAUNMHXwAaAgUAAAAASUVORK5CYII=");
            background-size: 4px 4px;
            font-family: 'MS Sans Serif', Tahoma, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .window {
            position: absolute;
            background: #c0c0c0;
            border: 2px outset #ffffff;
            min-width: 200px;
            min-height: 150px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        .image-content img {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: bicubic;
        }

        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            padding: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            height: 18px;
        }

        .title-bar-text {
            color: white;
            font-weight: bold;
            margin-left: 4px;
            pointer-events: none;
        }

        .title-bar-controls {
            display: flex;
            gap: 2px;
            margin-left: auto;
            height: 14px;
        }

        .control-button {
            width: 16px;
            height: 14px;
            background: #c0c0c0;
            border: 1px outset #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-family: "Courier New", monospace;
            font-size: 10px;
            padding: 0;
            line-height: 14px;
            position: relative;
            font-weight: bold;
        }

        .control-button.minimize::after {
            content: "_";
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
        }

        .control-button.maximize::after {
            content: "▢";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            font-size: 12px;
        }

        .control-button.close::after {
            content: "X";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .address-bar {
            background: #c0c0c0;
            padding: 3px;
            margin-top: 4px;
            margin-bottom: -2px;
            display: flex;
            align-items: center;
            font-size: 11px;
            height: 20px;
        }

        .address-box {
            flex: 1;
            background: white;
            border: 1px inset #808080;
            padding: 2px 4px;
            margin-right: 2px;
            margin-left: 2px;
            font-family: "MS Sans Serif", Arial, sans-serif;
            height: 14px;
            display: flex;
            align-items: center;
        }

        .address-text {
            flex: 1;
            letter-spacing: 0.2px;
        }

        .window-content {
            height: calc(100% - 95px);
            overflow: auto;
            background: white;
            border: 1px inset #808080;
            margin: 5px;
        }

        .folder {
            display: inline-block;
            margin: 12px;
            text-align: center;
            cursor: pointer;
            width: 100px;
            vertical-align: top;
        }

        .folder img, .folder .lazy-placeholder {
            width: 64px;
            height: 64px;
            margin-bottom: 6px;
            object-fit: cover;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        * {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .address-box input, .address-text {
            user-select: text;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
        }

        .lazy-placeholder {
            background: #e0e0e0;
            display: inline-block;
        }

        .folder-label {
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            font-size: 12px;
            padding: 0 2px;
            width: 100%;
            line-height: 1.2;
        }

        .taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: #c0c0c0;
            border-top: 2px solid #ffffff;
            display: flex;
            padding: 2px;
            gap: 2px;
            padding-left: 2px;
            z-index: 10000;
        }

        .taskbar-items {
            display: flex;
            flex-direction: row;
            gap: 2px;
            height: 100%;
            flex: 1;
        }

        .taskbar-item {
            padding: 2px 8px;
            background: #c0c0c0;
            border: 2px outset #ffffff;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        .taskbar-item.minimized {
            border: 2px inset #808080;
            background: #d4d0c8;
            padding: 3px 8px 1px 8px;
        }

        .taskbar-item.active {
            border: 1px inset #808080;
            background: #d4d0c8;
        }

        .image-window {
            position: absolute;
            background: #c0c0c0;
            border: 2px outset #ffffff;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        .image-content {
            padding: 2px;
            background: white;
            border: 1px inset #808080;
        }

        .window.fullscreen {
            width: 100vw !important;
            height: calc(100vh - 32px) !important;
            top: 0 !important;
            left: 0 !important;
        }

        /* Menu bar styles */
        .menu-bar {
            background: #c0c0c0;
            border-bottom: 1px solid #808080;
            padding: 2px;
            font-size: 11px;
            height: 20px;
            display: flex;
            align-items: center;
        }

        .menu-item {
            padding: 2px 8px;
            cursor: pointer;
        }

        .menu-item:hover {
            background: #0a246a;
            color: white;
        }

        .resizer {
            width: 20px;
            height: 20px;
            position: absolute;
            right: 0;
            bottom: 0;
            cursor: se-resize;
        }

        .status-bar {
            height: 20px;
            background: #c0c0c0;
            border-top: 1px solid #808080;
            border-bottom: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
            font-size: 11px;
            position: absolute;
            bottom: 2px;
            left: 5px;
            right: 5px; 
        }

        .taskbar-start {
            width: 28px;
            height: 24px;
            background: #c0c0c0;
            border: 2px outset #ffffff;
            margin-right: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .image-error {
            width: 64px;
            height: 64px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            text-align: center;
            color: #666;
            border: 1px solid #999;
            margin: 0 auto 6px auto;
        }

        .error-window {
            padding: 20px;
            text-align: center;
            color: #333;
        }

    </style>
</head>
<body>
    <div id="mainWindow" class="window" style="top: 30px; left: 30px; width: 1000px; height: 500px;">
        <div class="title-bar">
            <span class="title-bar-text">Fursuit Yiff Collection</span>
            <div class="title-bar-controls">
                <button class="control-button minimize"></button>
                <button class="control-button maximize"></button>
                <button class="control-button close"></button>
            </div>
        </div>
        <div class="menu-bar">
            <div class="menu-item">File</div>
            <div class="menu-item">Edit</div>
            <div class="menu-item">View</div>
            <div class="menu-item">Help</div>
        </div>
        <div class="status-bar">
            <div class="status-items">0 item(s)</div>
            <div class="status-state">Available</div>
        </div>
        <div class="address-bar">
            <div class="address-box">
                <div class="address-text">F:\My Pictures</div>
            </div>
        </div>
        <div class="window-content" id="window-content">
            <!-- content will be populated by JS here -->
        </div>
    </div>

    <div class="taskbar" id="taskbar">
      <a href="https://vilaa.neocities.org/">
        <div class="taskbar-start">
            <img src="paw.png" alt="icon" style="width: 20px; height: 20px;" onerror="this.style.display='none'">
        </div>
      </a>
        <div id="taskbar-items" class="taskbar-items"></div>
    </div>


    <script src="folder.js"></script>
    <script>
    
      let activeWindows = new Set();
      let zIndex = 1000;
      let isFullscreen = false;
      let currentPath = [];
      let previousState = {
          width: '1000px',
          height: '500px',
          top: '30px',
          left: '30px'
      };
      
      // Convert full image URL to thumbnail URL
      function getThumbnailUrl(fullUrl) {
          // Extract just the filename from the full path
          const filename = fullUrl.split('/').pop();
          return 'thumbnails/' + filename;
      }
      
      // Simple image loading
      function loadVisibleImages() {
          const content = document.querySelector('.window-content');
          const contentRect = content.getBoundingClientRect();
          const images = content.querySelectorAll('img[data-src]');
          
          images.forEach(img => {
              const rect = img.getBoundingClientRect();
              // Load if image is in or near viewport
              if (rect.bottom >= contentRect.top - 100 && rect.top <= contentRect.bottom + 100) {
                  if (!img.src || img.src === '') {
                      img.src = img.dataset.src;
                      img.onload = () => img.classList.remove('lazy-placeholder');
                      img.onerror = () => {
                          const errorDiv = document.createElement('div');
                          errorDiv.className = 'image-error';
                          errorDiv.innerHTML = `Failed to load<br>${img.dataset.title}<br>thumbnail`;
                          img.parentElement.insertBefore(errorDiv, img);
                          img.remove();
                      };
                  }
              }
          });
      }

      // Event delegation for window content
      document.getElementById('window-content').addEventListener('click', (e) => {
          const folder = e.target.closest('.folder');
          if (!folder) return;

          const action = folder.dataset.action;
          const data = folder.dataset;

          if (action === 'openFolder') {
              openFolder(data.name);
          } else if (action === 'openImage') {
              openImage(data.id, data.url, data.title);
          } else if (action === 'goBack') {
              goBack();
          }
      });

      function makeDraggable(element) {
          let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
          const titleBar = element.querySelector('.title-bar');
          if (!titleBar) return;
          
          titleBar.onmousedown = dragMouseDown;

          function dragMouseDown(e) {
              if (isFullscreen || e.target.classList.contains('control-button')) return;
              e.preventDefault();
              pos3 = e.clientX;
              pos4 = e.clientY;
              document.onmouseup = closeDragElement;
              document.onmousemove = elementDrag;
              element.style.zIndex = ++zIndex;
          }

          function elementDrag(e) {
              if (isFullscreen) return;
              e.preventDefault();
              pos1 = pos3 - e.clientX;
              pos2 = pos4 - e.clientY;
              pos3 = e.clientX;
              pos4 = e.clientY;
              
              // Calculate new position
              let newTop = element.offsetTop - pos2;
              let newLeft = element.offsetLeft - pos1;
              
              // Get viewport boundaries (accounting for taskbar)
              const maxX = window.innerWidth - element.offsetWidth;
              const maxY = window.innerHeight - element.offsetHeight - 36; // 30px for taskbar
              
              // Apply boundaries
              newTop = Math.max(0, Math.min(newTop, maxY));
              newLeft = Math.max(0, Math.min(newLeft, maxX));
              
              element.style.top = newTop + "px";
              element.style.left = newLeft + "px";
          }

          function closeDragElement() {
              document.onmouseup = null;
              document.onmousemove = null;
          }
      }

      const mainWindow = document.getElementById('mainWindow');
      makeDraggable(mainWindow);

      const resizer = document.createElement('div');
      resizer.className = 'resizer';
      mainWindow.appendChild(resizer);

      let isResizing = false;
      resizer.addEventListener('mousedown', (e) => {
          if (isFullscreen) return;
          isResizing = true;
          document.addEventListener('mousemove', resize);
          document.addEventListener('mouseup', stopResize);
      });

      function resize(e) {
          if (!isResizing || isFullscreen) return;
          
          const newWidth = Math.min(e.clientX - mainWindow.offsetLeft, window.innerWidth - mainWindow.offsetLeft);
          const newHeight = Math.min(e.clientY - mainWindow.offsetTop, window.innerHeight - mainWindow.offsetTop - 30); // 30px for taskbar
          
          if (newWidth > 200) mainWindow.style.width = newWidth + 'px';
          if (newHeight > 150) mainWindow.style.height = newHeight + 'px';
      }

      function stopResize() {
          isResizing = false;
          document.removeEventListener('mousemove', resize);
          document.removeEventListener('mouseup', stopResize);
      }

      mainWindow.querySelector('.minimize').onclick = () => {
          mainWindow.style.display = 'none';
          updateTaskbar();
      };

      mainWindow.querySelector('.maximize').onclick = () => {
          if (!isFullscreen) {
              previousState = {
                  width: mainWindow.style.width,
                  height: mainWindow.style.height,
                  top: mainWindow.style.top,
                  left: mainWindow.style.left
              };
              mainWindow.classList.add('fullscreen');
              isFullscreen = true;
          } else {
              mainWindow.classList.remove('fullscreen');
              mainWindow.style.width = previousState.width;
              mainWindow.style.height = previousState.height;
              mainWindow.style.top = previousState.top;
              mainWindow.style.left = previousState.left;
              isFullscreen = false;
          }
      };

      mainWindow.querySelector('.close').onclick = () => {
          mainWindow.style.display = 'none';
          updateTaskbar();
      };

      function updateTaskbar() {
          const taskbarItems = document.getElementById('taskbar-items');
          const mainWindow = document.getElementById('mainWindow');
          const fragment = document.createDocumentFragment();
          
          const mainItem = createTaskbarItem('Fursuit Yiff Collection', mainWindow);
          
          if (mainWindow.style.display === 'none') {
              mainItem.classList.add('minimized');
          }
          fragment.appendChild(mainItem);

          activeWindows.forEach(id => {
              const imgWindow = document.getElementById(`window-${id}`);
              if (imgWindow) {
                  const item = createTaskbarItem(imgWindow.dataset.title, imgWindow);
                  if (imgWindow.style.display === 'none') {
                      item.classList.add('minimized');
                  }
                  fragment.appendChild(item);
              }
          });

          taskbarItems.innerHTML = '';
          taskbarItems.appendChild(fragment);
      }

      function createTaskbarItem(text, window) {
          const item = document.createElement('div');
          item.className = 'taskbar-item';
          item.textContent = text;
          item.onclick = () => {
              if (window.style.display === 'none') {
                  window.style.display = 'block';
                  window.style.zIndex = ++zIndex;
              } else {
                  window.style.display = 'none';
              }
              updateTaskbar();
          };
          return item;
      }

      function updateAddressBar() {
          const addressText = document.querySelector('.address-text');
          if (currentPath.length > 0) {
              addressText.textContent = `F:\\My Pictures\\${currentPath.join('\\')}`;
          } else {
              addressText.textContent = 'F:\\My Pictures';
          }
      }

      function createImageElement(img) {
          // Use thumbnail URL for display, but keep full URL in data-url for opening
          const thumbnailUrl = getThumbnailUrl(img.url);
          return `
              <div class="folder" data-action="openImage" data-id="${img.id}" data-url="${img.url}" data-title="${img.title}">
                  <img 
                      class="lazy-placeholder"
                      data-src="${thumbnailUrl}" 
                      data-title="${img.title}"
                      alt="${img.title}"
                  >
                  <div class="folder-label" title="${img.title}">${img.title}</div>
              </div>
          `;
      }

      function renderFolderContent(currentFolder, showBackButton = true) {
          const content = mainWindow.querySelector('.window-content');
          const fragment = document.createDocumentFragment();
          const wrapper = document.createElement('div');
          
          // Back button
          if (showBackButton) {
              wrapper.innerHTML = `
                  <div class="folder" data-action="goBack">
                      <img src="folder.png" alt="back" onerror="this.style.visibility='hidden'">
                      <div class="folder-label">..</div>
                  </div>
              `;
          }
          
          // Folders
          if (currentFolder) {
              Object.entries(currentFolder)
                  .filter(([name]) => name !== 'files')
                  .forEach(([name, data]) => {
                      const folderEl = document.createElement('div');
                      folderEl.className = 'folder';
                      folderEl.dataset.action = 'openFolder';
                      folderEl.dataset.name = name;
                      folderEl.innerHTML = `
                          <img src="folder.png" alt="folder" onerror="this.style.visibility='hidden'">
                          <div class="folder-label" title="${name}">${name}</div>
                      `;
                      wrapper.appendChild(folderEl);
                  });
          }
          
          // Images
          if (currentFolder && currentFolder.files && Array.isArray(currentFolder.files)) {
              currentFolder.files.forEach(img => {
                  const temp = document.createElement('div');
                  temp.innerHTML = createImageElement(img);
                  wrapper.appendChild(temp.firstElementChild);
              });
          }

          content.innerHTML = '';
          content.appendChild(wrapper);
          
          // Load visible images immediately
          setTimeout(loadVisibleImages, 0);
          
          // Load more images on scroll
          content.onscroll = () => {
              clearTimeout(content.scrollTimeout);
              content.scrollTimeout = setTimeout(loadVisibleImages, 100);
          };

          // Update status
          let itemCount = 
              ((currentFolder && currentFolder.files) ? currentFolder.files.length : 0) +
              (currentFolder ? Object.entries(currentFolder).filter(([name]) => name !== 'files').length : 0);
          updateStatusBar(itemCount);
      }

      function openFolder(folderName) {
          if (!folderName) {
              console.error('Invalid folder name');
              return;
          }

          currentPath.push(folderName);
          let currentFolder = folders;
          
          try {
              // Navigate to the target folder
              for (let pathPart of currentPath) {
                  if (!currentFolder[pathPart] || !currentFolder[pathPart].content) {
                      throw new Error(`Invalid folder path: ${pathPart}`);
                  }
                  currentFolder = currentFolder[pathPart].content;
              }
              
              renderFolderContent(currentFolder);
              updateAddressBar();
              
          } catch (error) {
              console.error('Error accessing folder:', error);
              currentPath.pop(); // Remove the invalid path
              alert('Error: Could not open folder');
          }
      }

      function goBack() {
          if (currentPath.length === 0) {
              // Already at root, do nothing
              return;
          }

          // Remove current folder from path
          currentPath.pop();
          
          if (currentPath.length === 0) {
              // Going back to root
              renderFolderContent(folders, false);
          } else {
              // Navigate to parent folder
              let currentFolder = folders;
              for (let pathPart of currentPath) {
                  currentFolder = currentFolder[pathPart].content;
              }
              renderFolderContent(currentFolder);
          }
          
          updateAddressBar();
      }

      function openImage(id, url, title) {
          if (!id || !url || !title) {
              console.error('Invalid image parameters');
              return;
          }

          if (activeWindows.has(id)) {
              const existing = document.getElementById(`window-${id}`);
              if (existing) {
                  if (existing.style.display === 'none') {
                      existing.style.display = 'block';
                      existing.style.zIndex = ++zIndex;
                  } else {
                      existing.style.display = 'none';
                  }
                  updateTaskbar();
              }
              return;
          }

          const img = new Image();
          
          img.onerror = () => {
              const errorWindow = document.createElement('div');
              errorWindow.id = `window-${id}`;
              errorWindow.dataset.title = title;
              errorWindow.className = 'image-window';
              errorWindow.style.width = '300px';
              errorWindow.style.top = '70px';
              errorWindow.style.left = '70px';
              
              errorWindow.innerHTML = `
                  <div class="title-bar">
                      <span class="title-bar-text">${title} - Error</span>
                      <div class="title-bar-controls">
                          <button class="control-button minimize"></button>
                          <button class="control-button close"></button>
                      </div>
                  </div>
                  <div class="error-window">
                      <p>Could not load image:</p>
                      <p><strong>${title}</strong></p>
                      <p style="font-size: 11px; color: #666;">${url}</p>
                  </div>
              `;

              document.body.appendChild(errorWindow);
              makeDraggable(errorWindow);
              activeWindows.add(id);

              errorWindow.querySelector('.minimize').onclick = () => {
                  errorWindow.style.display = 'none';
                  updateTaskbar();
              };

              errorWindow.querySelector('.close').onclick = () => {
                  errorWindow.remove();
                  activeWindows.delete(id);
                  updateTaskbar();
              };

              errorWindow.style.zIndex = ++zIndex;
              updateTaskbar();
          };
          
          img.onload = () => {
              const viewportWidth = window.innerWidth;
              const viewportHeight = window.innerHeight - 30; // Account for taskbar
              
              const maxWidth = viewportWidth * 0.95;
              const maxHeight = viewportHeight * 0.95;
              
              let finalWidth = img.width;
              let finalHeight = img.height;
              
              if (finalWidth > maxWidth || finalHeight > maxHeight) {
                  const ratio = Math.min(maxWidth / finalWidth, maxHeight / finalHeight);
                  finalWidth = Math.floor(finalWidth * ratio);
                  finalHeight = Math.floor(finalHeight * ratio);
              }

              const imageWindow = document.createElement('div');
              imageWindow.id = `window-${id}`;
              imageWindow.dataset.title = title;
              imageWindow.className = 'image-window';
              imageWindow.style.width = (finalWidth + 4) + 'px';
              
              // Calculate position to ensure window is visible
              let topPos = 70;
              let leftPos = 70;
              
              // Ensure window fits in viewport
              const windowWidth = finalWidth + 4;
              const windowHeight = finalHeight + 30; // Account for title bar
              
              if (leftPos + windowWidth > window.innerWidth) {
                  leftPos = Math.max(10, window.innerWidth - windowWidth - 10);
              }
              if (topPos + windowHeight > window.innerHeight - 30) { // 30px for taskbar
                  topPos = Math.max(10, window.innerHeight - windowHeight - 40); // 40 = 30 (taskbar) + 10 (margin)
              }
              
              imageWindow.style.top = topPos + 'px';
              imageWindow.style.left = leftPos + 'px';
              
              imageWindow.innerHTML = `
                  <div class="title-bar">
                      <span class="title-bar-text">${title}</span>
                      <div class="title-bar-controls">
                          <button class="control-button minimize"></button>
                          <button class="control-button close"></button>
                      </div>
                  </div>
                  <div class="image-content">
                      <img 
                          src="${url}" 
                          alt="${title}" 
                          style="width: ${finalWidth}px; height: ${finalHeight}px; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges;"
                          onerror="this.parentElement.innerHTML='<div class=\\'error-window\\'>Error loading image</div>'"
                      >
                  </div>
              `;

              document.body.appendChild(imageWindow);
              makeDraggable(imageWindow);
              activeWindows.add(id);

              imageWindow.querySelector('.minimize').onclick = () => {
                  imageWindow.style.display = 'none';
                  updateTaskbar();
              };

              imageWindow.querySelector('.close').onclick = () => {
                  imageWindow.remove();
                  activeWindows.delete(id);
                  updateTaskbar();
              };

              imageWindow.style.zIndex = ++zIndex;
              updateTaskbar();
          };
          
          // Load the full resolution image, not the thumbnail
          img.src = url;
      }

      function updateStatusBar(itemCount) {
          const statusItems = document.querySelector('.status-items');
          if (statusItems) {
              statusItems.textContent = `${itemCount} item(s)`;
          }
      }

      // Initialize
      renderFolderContent(folders, false); // Show root without back button
      updateTaskbar();
    </script>
